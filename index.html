<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>How long is phoebe dragging dyad?</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    },
                    animation: {
                        'fade-in': 'fadeIn 1s ease-out',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0', transform: 'translateY(10px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            background-color: #0f172a;
            background-image: 
                radial-gradient(at 0% 0%, hsla(253,16%,7%,1) 0, transparent 50%), 
                radial-gradient(at 50% 0%, hsla(225,39%,30%,0.2) 0, transparent 50%), 
                radial-gradient(at 100% 0%, hsla(339,49%,30%,0.2) 0, transparent 50%);
            background-attachment: fixed;
        }
        /* Ensures numbers don't shift the layout horizontally as they change */
        .tabular-nums {
            font-variant-numeric: tabular-nums;
        }
    </style>
</head>
<body class="text-white min-h-screen flex items-center justify-center p-4 selection:bg-purple-500/30">

    <div class="max-w-4xl w-full animate-fade-in flex flex-col items-center">
        
        <h1 class="text-3xl sm:text-5xl md:text-6xl font-extrabold text-center mb-12 tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 pb-2">
            How long is Phoebe dragging Dyad?
        </h1>

        <div class="bg-gray-900/60 backdrop-blur-xl border border-gray-700/50 rounded-3xl p-8 md:p-12 shadow-2xl w-full">
            
            <div class="flex flex-wrap items-center justify-center gap-4 sm:gap-6 md:gap-8 lg:gap-12">
                
                <!-- Days -->
                <div class="flex flex-col items-center">
                    <span id="days" class="text-4xl sm:text-6xl md:text-7xl font-mono font-bold tabular-nums text-white">00</span>
                    <span class="text-xs sm:text-sm uppercase tracking-[0.2em] text-gray-400 mt-2 font-semibold">Days</span>
                </div>

                <div class="text-3xl sm:text-5xl font-mono text-gray-600 mb-6 hidden sm:block">:</div>

                <!-- Hours -->
                <div class="flex flex-col items-center">
                    <span id="hours" class="text-4xl sm:text-6xl md:text-7xl font-mono font-bold tabular-nums text-white">00</span>
                    <span class="text-xs sm:text-sm uppercase tracking-[0.2em] text-gray-400 mt-2 font-semibold">Hours</span>
                </div>

                <div class="text-3xl sm:text-5xl font-mono text-gray-600 mb-6 hidden sm:block">:</div>

                <!-- Minutes -->
                <div class="flex flex-col items-center">
                    <span id="minutes" class="text-4xl sm:text-6xl md:text-7xl font-mono font-bold tabular-nums text-white">00</span>
                    <span class="text-xs sm:text-sm uppercase tracking-[0.2em] text-gray-400 mt-2 font-semibold">Mins</span>
                </div>

                <div class="text-3xl sm:text-5xl font-mono text-gray-600 mb-6 hidden sm:block">:</div>

                <!-- Seconds -->
                <div class="flex flex-col items-center">
                    <span id="seconds" class="text-4xl sm:text-6xl md:text-7xl font-mono font-bold tabular-nums text-white">00</span>
                    <span class="text-xs sm:text-sm uppercase tracking-[0.2em] text-gray-400 mt-2 font-semibold">Secs</span>
                </div>

            </div>

            <div class="mt-8 sm:mt-12 flex flex-col items-center justify-center border-t border-gray-700/50 pt-8 sm:pt-10">
                <div class="flex items-baseline gap-2 text-pink-400">
                    <span id="milliseconds" class="text-3xl sm:text-5xl font-mono font-bold tabular-nums w-[3ch] text-center inline-block">000</span>
                    <span class="text-sm sm:text-base uppercase tracking-[0.1em] font-semibold opacity-80">ms</span>
                </div>
                <div class="mt-4 px-4 py-2 bg-gray-800/50 rounded-full border border-gray-700/30">
                    <p class="text-xs sm:text-sm text-gray-400 font-mono text-center">
                        Since <span id="startDateDisplay" class="text-gray-300">...</span>
                    </p>
                </div>
            </div>

        </div>
    </div>

    <script>
        // The specific Unix timestamp to count up from (in milliseconds)
        const START_TIME = 1790746001779; 
        
        // Format the start date for the display label at the bottom
        const startDate = new Date(START_TIME);
        document.getElementById('startDateDisplay').textContent = startDate.toLocaleString('en-US', {
            weekday: 'long', 
            year: 'numeric', 
            month: 'long', 
            day: 'numeric', 
            hour: '2-digit', 
            minute: '2-digit',
            timeZoneName: 'short'
        });

        // Get DOM elements
        const daysEl = document.getElementById('days');
        const hoursEl = document.getElementById('hours');
        const minutesEl = document.getElementById('minutes');
        const secondsEl = document.getElementById('seconds');
        const millisecondsEl = document.getElementById('milliseconds');

        // Helper to pad single-digit numbers with leading zeros
        const pad = (num, length = 2) => num.toString().padStart(length, '0');

        function updateCounter() {
            const now = Date.now();
            let diff = now - START_TIME;

            // If the current time is somehow before the start time, display all zeros
            if (diff < 0) {
                diff = 0;
            }

            // Calculate time units
            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
            const minutes = Math.floor((diff / 1000 / 60) % 60);
            const seconds = Math.floor((diff / 1000) % 60);
            const milliseconds = Math.floor(diff % 1000);

            // Update DOM efficiently
            daysEl.textContent = pad(days);
            hoursEl.textContent = pad(hours);
            minutesEl.textContent = pad(minutes);
            secondsEl.textContent = pad(seconds);
            millisecondsEl.textContent = pad(milliseconds, 3); // Milliseconds get 3 digits

            // Use requestAnimationFrame for the smoothest possible updates
            // (especially important for milliseconds rendering rapidly)
            requestAnimationFrame(updateCounter);
        }

        // Start the loop
        updateCounter();
    </script>
</body>
</html>
